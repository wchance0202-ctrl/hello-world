<!doctype html>

<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =====================================================================
 * 配置：颜色、缓动、转场时长、事件文字都在这里改
 * 所有时间点都来自 beats.json（这里只写"第几拍"，或 'drop' / 'final_hit'）
 * ===================================================================== */
const CONFIG = {
  width: 1920, height: 1080, fps: 30,
  font: '"Noto Sans SC"',
  colors: {
    bgTop: '#0A1222', bgBottom: '#03050A', bgWarm: '#1E140A',
    primary: '#6A98FF',     // 主色：冷蓝
    accent: '#FFB547',      // 强调色：琥珀（只在蓄/爆段逐渐出现）
    text: '#F3F5F9', textDim: '#A3ADBE', axis: '#2A3346', tick: '#46526A',
  },
  // 全片唯一的缓动族：指数曲线，strength 越大越"陡"
  ease: { strength: 6 },
  transition: {
    leadFrames: 5,          // 拍点前 5 帧开始猛加速
    settleFrames: 4,        // 拍点落定后的缓冲帧数
    landAt: 0.97,           // 拍点那一帧完成 97%，余下 3% 在缓冲里走完
    // 每段的转场窗口（秒）和"预备量"（加速前已经走完的比例）
    window: { '起': 0.9, '承': 0.5, '蓄': 0.3, '爆': 0.3, '尾': 0.9 },
    antic:  { '起': 0.22, '承': 0.2, '蓄': 0.15, '爆': 0.15, '尾': 0.3 },
    pushZoom: 9,            // 推进穿过画面时旧画面放大到几倍
    flashWindow: 0.22,      // 蓄段单词切换的窗口（秒）
  },
  camera: { ambientZoom: { '起': 0.05, '承': 0.03, '蓄': 0.06, '爆': 0.03, '尾': 0 } },
  energy: { '起': [0.10, 0.22], '承': [0.30, 0.55], '蓄': [0.60, 0.90], '爆': [1.0, 1.0], '尾': [0.75, 0.6] },
  stage: { x: 960, y: 380, scale: 1.0 },      // 图形中心与整体缩放
  // 质感：光晕、胶片颗粒、透视地面、背景巨型年份、前景虚化光斑
  look: {
    focal: 1100,                      // 3D 粒子的透视焦距
    bloom: [0.45, 1.0],               // 光晕强度：起 → 爆（随能量增长）
    grain: 0.10,
    floor: { horizon: 440, alpha: 0.20, spacing: 170 },
    giantYear: { size: 540, y: 330, alpha: 0.13, spacing: 1500, drift: 0.12 },
    bokeh: [5, 22],                   // 前景光斑数量：起 → 爆
  },
  center: { x: 960, y: 540 },                 // 回顾、光点、drop 光环以画面正中为原点
  centeredMotifs: ['stream', 'point', 'burst'],
  axis: { y: 690, pxPerMonth: 200, minGap: 600, endMargin: 250 },
  text: { yearY: 768, nameY: 846, meaningY: 920, flashY: 862 },
  shots: [
    { id: 'chatgpt', beat: 0,  date: '2022-11-30', ym: '2022.11', name: 'ChatGPT', meaning: '人人都能和 AI 聊天', motif: 'chat', out: 'morph' },
    { id: 'gpt4',    beat: 8,  date: '2023-03-14', ym: '2023.03', name: 'GPT-4', meaning: '能看图，律师考试前 10%', motif: 'grid', out: 'morph' },
    { id: 'sora',    beat: 16, date: '2024-02-15', ym: '2024.02', name: 'Sora', meaning: '一句话，生成一段视频', motif: 'film', out: 'morph' },
    { id: 'gpt4o',   beat: 20, date: '2024-05-13', ym: '2024.05', name: 'GPT-4o', meaning: '实时听、看、说', motif: 'wave', out: 'morph' },
    { id: 'o1',      beat: 24, date: '2024-09-12', ym: '2024.09', name: 'o1', meaning: '先思考，再回答', motif: 'tree', out: 'morph' },
    { id: 'nobel',   beat: 28, date: '2024-10-08', ym: '2024.10', name: '诺贝尔奖', meaning: 'AI 研究同获物理、化学奖', motif: 'helix', out: 'morph' },
    { id: 'cu',      beat: 32, date: '2024-10-22', ym: '2024.10', name: 'Claude Computer Use', meaning: 'AI 学会操作电脑', motif: 'window', out: 'push' },
    { id: 'r1',      beat: 36, date: '2025-01-20', flash: ['2025.01', 'DeepSeek-R1', '开源推理'], motif: 'scatter', out: 'wipe' },
    { id: 'agent',   beat: 40, date: '2025-07-17', flash: ['2025.07', 'ChatGPT agent', '代你办事'], motif: 'network', out: 'push' },
    { id: 'recap',   beat: 44, date: '2025-10-20', flash: ['会聊天', '会思考', '会动手'], motif: 'stream', out: 'morph', station: false, textCenter: true },
    { id: 'point',   beat: 'drums_stop', date: '2026-01-25', motif: 'point', out: 'burst', station: false, noText: true },
    { id: 'openclaw', beat: 'drop', date: '2026-01-25', ym: '2026.01', name: 'OpenClaw', meaning: 'AI 真的开始干活了', motif: 'burst', out: 'pullback', centerText: true, win: 0.5, anticAmt: 0.3 },  // 光点在鼓停的半拍里整段收缩蓄力
    { id: 'end',     beat: 'final_hit', motif: 'end', noText: true,
      line: [['三年多，AI 从', 'text'], ['会聊天', 'primary'], ['走到了', 'text'], ['会干活', 'accent']] },
  ],
  fadeOut: 0.8,       // 结尾淡出（秒）
  debug: /[?&]debug=1/.test(location.search),
};

/* ===================================================================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = CONFIG.width, H = CONFIG.height, FPS = CONFIG.fps;
const C = CONFIG.colors;
const N = 420;            // 粒子总数（所有图形共用一套粒子，才能互相变形）
let BEATS = null, SHOTS = null, BEAT = 0.5;

// ---------- 工具 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const RGB = Object.fromEntries(Object.entries(C).map(([k, v]) => [k, hex2rgb(v)]));
function mixRGB(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
function colOf(c) {         // 0 = 主色，1 = 白，2 = 强调色
  return c <= 1 ? mixRGB(RGB.primary, RGB.text, clamp(c)) : mixRGB(RGB.text, RGB.accent, clamp(c - 1));
}
function rgba(rgb, a) { return `rgba(${rgb[0] | 0},${rgb[1] | 0},${rgb[2] | 0},${clamp(a)})`; }

// ---------- 统一缓动（指数族） ----------
const EASE = {
  in(u, s = CONFIG.ease.strength) { u = clamp(u); if (s < 1e-3) return u; return (Math.exp(s * u) - 1) / (Math.exp(s) - 1); },
  out(u, s = CONFIG.ease.strength) { return 1 - EASE.in(1 - u, s); },
  inOut(u, s = CONFIG.ease.strength) { u = clamp(u); return u < 0.5 ? EASE.in(2 * u, s) / 2 : 1 - EASE.in(2 - 2 * u, s) / 2; },
};
const sCache = new Map();
function solveS(Wn, L, antic) {     // 求曲线陡度：使得"拍点前 L 秒"时恰好只走完 antic
  const key = Wn + '|' + L + '|' + antic;
  if (sCache.has(key)) return sCache.get(key);
  const u = clamp(1 - L / Wn, 0, 0.999);
  let lo = 0.01, hi = 80;
  if (EASE.in(u, lo) <= antic) { sCache.set(key, lo); return lo; }
  for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (EASE.in(u, m) > antic) lo = m; else hi = m; }
  sCache.set(key, lo); return lo;
}
// 卡拍曲线：tb 为拍点时间。拍点前慢慢预备，最后 leadFrames 帧猛加速，拍点那一帧落定，再缓冲 settleFrames 帧
function hit(t, tb, Wn = 0.35, antic = 0.15) {
  const T = CONFIG.transition, L = T.leadFrames / FPS, S = T.settleFrames / FPS;
  const f = t * FPS, fb = Math.round(tb * FPS);
  if (f < fb - Wn * FPS - 1e-6) return 0;
  if (f < fb - 1e-6) return T.landAt * EASE.in((t - (tb - Wn)) / Wn, solveS(Wn, L, antic));
  if (f < fb + T.settleFrames - 1e-6) return T.landAt + (1 - T.landAt) * EASE.out((t - tb) / S, 4);
  return 1;
}
// 拍上的一次"脉冲"：拍点那一帧最强，之后衰减
function pulse(t, tb, len = 0.42) { if (t * FPS < Math.round(tb * FPS) - 1e-6) return 0; return 1 - EASE.out((t - tb) / len, 5); }

// ---------- 时间 ----------
function sectionAt(t) { const s = BEATS.sections.find(s => t >= s.start - 1e-6 && t < s.end - 1e-6); return s ? s.name : BEATS.sections[BEATS.sections.length - 1].name; }
function energy(t) {
  const s = BEATS.sections.find(s => t >= s.start - 1e-6 && t < s.end - 1e-6) || BEATS.sections[BEATS.sections.length - 1];
  const [a, b] = CONFIG.energy[s.name]; return lerp(a, b, clamp((t - s.start) / (s.end - s.start)));
}
function monthF(d) { const [y, m, dd] = d.split('-').map(Number); const dim = new Date(y, m, 0).getDate(); return (y - 2022) * 12 + (m - 1) + (dd - 1) / dim; }

function initShots() {
  BEAT = BEATS.beat_sec;
  SHOTS = CONFIG.shots.map(s => ({ ...s }));
  SHOTS.forEach((s, i) => {
    s.beatIdx = typeof s.beat === 'number' ? s.beat : BEATS[s.beat].beat;
    s.t0 = BEATS.beats[s.beatIdx];
    s.sec = sectionAt(s.t0);
    s.W = s.win ?? CONFIG.transition.window[s.sec];
    s.antic = s.anticAmt ?? CONFIG.transition.antic[s.sec];
  });
  SHOTS.forEach((s, i) => { s.next = SHOTS[i + 1] || null; s.prev = SHOTS[i - 1] || null; s.dur = (s.next ? s.next.t0 : BEATS.duration) - s.t0; });
  // 时间轴：站点按真实日期排，但相邻站点至少隔 minGap 像素（同月两件事也读得清）
  let x = 0, pm = null; const knots = [];
  SHOTS.forEach(s => {
    if (!s.date) { s.x = x; return; }
    const m = monthF(s.date);
    if (pm !== null && m > pm) x += Math.max(CONFIG.axis.minGap, (m - pm) * CONFIG.axis.pxPerMonth);
    s.x = x; s.m = m;
    if (pm === null || m > pm) knots.push([m, x]);
    pm = m;
  });
  AXIS.knots = knots;
  const st = SHOTS.filter(s => s.date);
  AXIS.x0 = st[0].x; AXIS.x1 = st[st.length - 1].x;
  AXIS.fitZoom = (W - 2 * CONFIG.axis.endMargin) / (AXIS.x1 - AXIS.x0);
  AXIS.mid = (AXIS.x0 + AXIS.x1) / 2;
  const yrs = {}; st.filter(s => s.station !== false).forEach(s => { const y = +s.date.slice(0, 4); (yrs[y] = yrs[y] || []).push(s.x); });
  AXIS.years = Object.entries(yrs).map(([y, xs]) => ({ y, x0: Math.min(...xs), x1: Math.max(...xs) }));
  initStatic();
}
const AXIS = {};
function dateX(m) {
  const k = AXIS.knots, ppm = CONFIG.axis.pxPerMonth;
  if (m <= k[0][0]) return k[0][1] + (m - k[0][0]) * ppm;
  for (let i = 1; i < k.length; i++) if (m <= k[i][0]) return lerp(k[i - 1][1], k[i][1], (m - k[i - 1][0]) / (k[i][0] - k[i - 1][0]));
  const l = k[k.length - 1]; return l[1] + (m - l[0]) * ppm;
}

// 当前处于哪个镜头 / 哪次转场
function stateAt(t) {
  const f = t * FPS; let i = 0;
  SHOTS.forEach((s, k) => { if (Math.round(s.t0 * FPS) <= f + 1e-6) i = k; });
  const s = SHOTS[i];
  if (i > 0 && f < Math.round(s.t0 * FPS) + CONFIG.transition.settleFrames - 1e-6)
    return { a: SHOTS[i - 1], b: s, p: hit(t, s.t0, s.W, s.antic) };
  if (s.next && t >= s.next.t0 - s.next.W) return { a: s, b: s.next, p: hit(t, s.next.t0, s.next.W, s.next.antic) };
  return { a: s, b: s, p: 0 };
}

// ---------- 3D 粒子 ----------
function P3(x, y, z, s = 5, a = 1, c = 0.6) { return { x, y, z, s, a, c }; }
function pack(list) { const out = []; for (let i = 0; i < N; i++) { if (i < list.length) out.push(list[i]); else { const q = list[i % Math.max(1, list.length)]; out.push({ ...q, a: 0 }); } } return out; }
function hv(t, tb, Wn = 0.35, antic = 0.15) { return hit(t, tb, Wn, antic); }
function steps(t, t0, n, Wn = 0.3) { let s = 0; for (let j = 1; j <= n; j++) s += hv(t, t0 + j * BEAT, Wn, 0.12); return s; }
const ROT0 = { rx: 0, ry: 0, rz: 0 };
function fib(n, r) { const out = []; for (let i = 0; i < n; i++) { const y = 1 - 2 * (i + 0.5) / n, rr = Math.sqrt(1 - y * y), th = i * 2.399963; out.push([Math.cos(th) * rr * r, y * r, Math.sin(th) * rr * r]); } return out; }
function rotY(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c]; }
function bez(a, b, c, u) { const v = 1 - u; return [0, 1, 2].map(i => v * v * a[i] + 2 * v * u * b[i] + u * u * c[i]); }
function nearestEdges(pts, k, maxD) {
  const e = [], seen = new Set();
  pts.forEach((p, i) => {
    const d = pts.map((q, j) => [j, Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2])]).filter(([j, dd]) => j !== i && dd < maxD).sort((a, b) => a[1] - b[1]).slice(0, k);
    d.forEach(([j]) => { const key = Math.min(i, j) + '-' + Math.max(i, j); if (!seen.has(key)) { seen.add(key); e.push([i, j]); } });
  });
  return e;
}

const STATIC = {};
let GRAIN = null;
function initStatic() {
  const r = mulberry32(20221130);
  STATIC.dust = Array.from({ length: 320 }, () => ({ x: r() * 2400, y: r() * H * 0.62, z: 0.15 + r() * 0.6, s: 0.5 + r() * 1.3, k: r() }));
  STATIC.bokeh = Array.from({ length: 24 }, () => ({ x: r() * 2600, y: r() * H, rad: 50 + r() * 120, k: r(), z: 1.4 + r() * 0.9 }));
  // ChatGPT：两个粒子球 + 一来一回的光流
  STATIC.sph = fib(110, 1);
  STATIC.chatStart = Array.from({ length: 220 }, () => [(r() * 2 - 1) * 760, (r() * 2 - 1) * 420, (r() * 2 - 1) * 500]);
  STATIC.chatFlow = Array.from({ length: 140 }, (_, i) => ({ u: r(), j: [(r() - 0.5) * 16, (r() - 0.5) * 16, (r() - 0.5) * 16], up: i < 70 }));
  // GPT-4：一幅像素风景（太阳 + 山）
  const img = [];
  for (let rr = 0; rr < 12; rr++) for (let c = 0; c < 18; c++) {
    const ridge = 7.6 - 2.8 * Math.exp(-(((c - 5) / 2.6) ** 2)) - 1.9 * Math.exp(-(((c - 12.5) / 2.2) ** 2));
    const sun = Math.hypot(c - 13, (rr - 2.6) * 1.1) < 2.0;
    const b = sun ? 1 : rr > ridge ? 0.48 + 0.3 * clamp((rr - ridge) / 4) : 0.08 + 0.1 * (rr / 12);
    img.push({ c, r: rr, b });
  }
  STATIC.img = img;
  // Sora：每一帧胶片里的“画面”
  STATIC.film = Array.from({ length: 9 }, () => Array.from({ length: 12 }, () => ({ x: (r() - 0.5) * 160, y: (r() - 0.5) * 96, b: 0.3 + r() * 0.7 })));
  // o1：思考树的纵深
  STATIC.treeZ = Array.from({ length: 31 }, () => r() * 2 - 1);
  // DeepSeek-R1：由内向外扩散的开源粒子云
  const cl = [];
  while (cl.length < 400) { const p = [r() * 2 - 1, r() * 2 - 1, r() * 2 - 1], d = Math.hypot(...p); if (d < 1) cl.push({ p: [p[0] * 380, p[1] * 225, p[2] * 320], d, s: 2.6 + r() * 4.2, c: 0.3 + r() * 0.75 }); }
  cl.sort((a, b) => a.d - b.d);
  STATIC.cloud = cl;
  STATIC.cloudEdges = nearestEdges(cl.map(q => q.p), 1, 75);
  // ChatGPT agent：旋转的网络球
  STATIC.globe = fib(72, 250); STATIC.atmo = fib(300, 252);
  STATIC.globeEdges = nearestEdges(STATIC.globe, 3, 200);
  const nb = STATIC.globe.map((_, i) => STATIC.globeEdges.filter(e => e[0] === i || e[1] === i).map(e => e[0] === i ? e[1] : e[0]));
  STATIC.paths = Array.from({ length: 6 }, (_, q) => { let cur = [3, 20, 37, 51, 64, 11][q]; const p = [cur]; for (let k = 0; k < 5; k++) { const o = nb[cur]; cur = o[Math.floor(r() * o.length)]; p.push(cur); } return p; });
  // 回顾、drop
  STATIC.stream = Array.from({ length: N }, () => ({ th: r() * Math.PI * 2, v: 0.7 + r() * 0.6, ph: r(), k: r() }));
  STATIC.sparks = Array.from({ length: 8 }, () => Array.from({ length: 32 }, (_, k) => ({ th: (k + r() * 0.8) / 32 * Math.PI * 2, v: 0.6 + r() * 0.6 })));
  STATIC.ringJ = Array.from({ length: 340 }, () => [r() * 2 - 1, r() * 2 - 1]);
  // 胶片颗粒
  const gc = document.createElement('canvas'); gc.width = gc.height = 256;
  const gx = gc.getContext('2d'), id = gx.createImageData(256, 256);
  for (let i = 0; i < 256 * 256; i++) { const v = 128 + (r() - 0.5) * 255; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }
  gx.putImageData(id, 0, 0);
  GRAIN = ctx.createPattern(gc, 'repeat');
}

// ---------- 各事件的 3D 图形 ----------
const MOTIFS = {
  chat(s, tau, t) {   // 两个粒子球：一个先出现，另一个回应，光流一来一回
    tau = Math.max(0, tau);
    const aA = hv(t, s.t0 + BEAT, 0.9, 0.25), aB = hv(t, s.t0 + 2 * BEAT, 0.7, 0.2), aS = hv(t, s.t0 + 3 * BEAT, 0.6, 0.2);
    let pa = 0, pb = 0;
    for (let j = 1; j < 8; j++) { const p = pulse(t, s.t0 + j * BEAT, 0.5); if (j % 2) pa = Math.max(pa, p); else pb = Math.max(pb, p); }
    const spin = 0.9 * EASE.inOut(clamp(tau / s.dur), 3), list = [];
    const sphere = (cx, a, pl, col, off) => STATIC.sph.forEach((q, i) => {
      const R = 66 * (1 + 0.12 * pl), p = rotY([q[0] * R, q[1] * R, q[2] * R], spin + off), st = STATIC.chatStart[off ? 110 + i : i];
      list.push(P3(lerp(st[0], cx + p[0], a), lerp(st[1], p[1], a), lerp(st[2], p[2], a), 5.2, (0.2 + 0.8 * a) * (0.75 + 0.25 * pl) * Math.min(1, a * 3), col));
    });
    sphere(-185, aA, pa, 0.9, 0); sphere(185, aB, pb, 0.3, 1);
    let uA = 0, uB = 0;
    for (let j = 3; j < 8; j += 2) uA += hv(t, s.t0 + j * BEAT, 0.45, 0.15);
    for (let j = 4; j < 8; j += 2) uB += hv(t, s.t0 + j * BEAT, 0.45, 0.15);
    const actA = Math.max(...[3, 5, 7].map(j => pulse(t, s.t0 + j * BEAT, 0.9))), actB = Math.max(...[4, 6].map(j => pulse(t, s.t0 + j * BEAT, 0.9)));
    STATIC.chatFlow.forEach(f => {
      const u = (f.u + 0.55 * (f.up ? uA : uB)) % 1;
      const p = f.up ? bez([-118, -32, 0], [0, -180, 60], [118, -32, 0], u) : bez([118, 32, 0], [0, 180, -60], [-118, 32, 0], u);
      list.push(P3(p[0] + f.j[0], p[1] + f.j[1], p[2] + f.j[2], 3.4, aS * Math.sin(Math.PI * u) * (0.15 + 0.85 * (f.up ? actA : actB)), f.up ? 1 : 0.5));
    });
    return { pts: pack(list), edges: [], rot: { rx: 0.12, ry: -0.22 + 0.44 * EASE.inOut(clamp(tau / s.dur), 3), rz: 0 } };
  },
  grid(s, tau, t) {   // 一幅被逐行“看懂”的像素画
    tau = Math.max(0, tau);
    const list = STATIC.img.map(q => {

function camera(st, t) {
  const { a, b, p } = st;
  if (a.motif === 'end') return { x: AXIS.mid, z: AXIS.fitZoom };
  if (a.out === 'pullback' && b !== a) return { x: lerp(a.x, AXIS.mid, p), z: Math.exp(lerp(0, Math.log(AXIS.fitZoom), p)) };
  return { x: lerp(a.x, b.x, p), z: 1 };
}
const sx = (wx, cam) => (wx - cam.x) * cam.z + W / 2;

function drawBackground(t, cam, focusY) {
  const e = energy(t), warm = clamp((e - 0.55) / 0.45);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgba(mixRGB(RGB.bgTop, RGB.bgWarm, warm * 0.8), 1)); g.addColorStop(1, rgba(RGB.bgBottom, 1));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 舞台背后的光源：颜色随能量从冷蓝走向琥珀
  const lc = mixRGB(RGB.primary, RGB.accent, warm);
  const lg = ctx.createRadialGradient(W / 2, focusY, 0, W / 2, focusY, 820);
  lg.addColorStop(0, rgba(lc, 0.10 + 0.12 * e)); lg.addColorStop(0.5, rgba(lc, 0.035 + 0.04 * e)); lg.addColorStop(1, rgba(lc, 0));
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  // 远处星尘（视差）
  const n = Math.floor(50 + 250 * e);
  for (let i = 0; i < n; i++) {
    const d = STATIC.dust[i], x = (((d.x - cam.x * d.z * 0.5) % 2400) + 2400) % 2400 - 240;
    ctx.fillStyle = rgba(d.k > 0.85 && e > 0.6 ? RGB.accent : RGB.primary, (0.10 + 0.3 * d.z) * (0.35 + 0.65 * e));
    ctx.beginPath(); ctx.arc(x, d.y, d.s * (0.7 + 0.4 * e), 0, 7); ctx.fill();
  }
}

function drawGiantYears(cam, alpha) {
  if (alpha <= 0.01) return;
  const G = CONFIG.look.giantYear;
  ctx.save(); ctx.font = `800 ${G.size}px ${CONFIG.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.letterSpacing = '-8px';
  const Y = AXIS.years; let fi = 0;
  for (let k = 0; k < Y.length; k++) {
    if (cam.x >= Y[k].x0) fi = k + G.drift * (Y[k].x1 > Y[k].x0 ? clamp((cam.x - Y[k].x0) / (Y[k].x1 - Y[k].x0)) : 0);
    if (k + 1 < Y.length && cam.x > Y[k].x1 && cam.x < Y[k + 1].x0) fi = k + G.drift + (1 - G.drift) * EASE.inOut((cam.x - Y[k].x1) / (Y[k + 1].x0 - Y[k].x1), 2);
  }
  Y.forEach(({ y }, k) => {
    const px = W / 2 + (k - fi) * G.spacing; if (px < -1000 || px > W + 1000) return;
    const near = 1 - clamp(Math.abs(px - W / 2) / 1100);
    const gr = ctx.createLinearGradient(0, G.y - G.size / 2, 0, G.y + G.size / 2);
    gr.addColorStop(0, rgba(RGB.primary, alpha * G.alpha * near * 0.5)); gr.addColorStop(1, rgba(RGB.primary, 0));
    ctx.fillStyle = gr; ctx.fillText(y, px, G.y);
    ctx.lineWidth = 1.5; ctx.strokeStyle = rgba(RGB.primary, alpha * G.alpha * (0.35 + 0.65 * near)); ctx.strokeText(y, px, G.y);
  });
  ctx.restore();
}

function drawFloor(cam, alpha) {      // 透视地面：时间轴是地面的前沿，镜头横移时近快远慢
  if (alpha <= 0.01) return;
  const F = CONFIG.look.floor, hor = F.horizon, ay = CONFIG.axis.y, A = alpha * F.alpha;
  ctx.save(); ctx.lineWidth = 1;
  const X0 = Math.floor((cam.x - 7000) / F.spacing) * F.spacing;
  for (let X = X0; X < cam.x + 7000; X += F.spacing) {
    const dx = (X - cam.x) * cam.z, xn = dx + W / 2, zf = 9, xfar = dx / zf + W / 2, yfar = hor + (ay - hor) / zf;
    const zn = 0.72, xnear = dx / zn + W / 2, ynear = hor + (ay - hor) / zn;
    if (Math.min(xn, xfar, xnear) > W + 50 || Math.max(xn, xfar, xnear) < -50) continue;
    const g1 = ctx.createLinearGradient(0, ay, 0, yfar); g1.addColorStop(0, rgba(RGB.primary, A)); g1.addColorStop(1, rgba(RGB.primary, 0));
    ctx.strokeStyle = g1; ctx.beginPath(); ctx.moveTo(xn, ay); ctx.lineTo(xfar, yfar); ctx.stroke();
    const g2 = ctx.createLinearGradient(0, ay, 0, ynear); g2.addColorStop(0, rgba(RGB.primary, A * 0.6)); g2.addColorStop(1, rgba(RGB.primary, 0));
    ctx.strokeStyle = g2; ctx.beginPath(); ctx.moveTo(xn, ay); ctx.lineTo(xnear, ynear); ctx.stroke();
  }
  for (const z of [1.2, 1.5, 1.95, 2.7, 3.9, 6]) { const y = hor + (ay - hor) / z; ctx.strokeStyle = rgba(RGB.primary, A * 0.9 / z); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  // 地平线上的一层薄雾光
  const hg = ctx.createLinearGradient(0, hor - 60, 0, hor + 60);
  hg.addColorStop(0, rgba(RGB.primary, 0)); hg.addColorStop(0.5, rgba(RGB.primary, alpha * 0.05)); hg.addColorStop(1, rgba(RGB.primary, 0));
  ctx.fillStyle = hg; ctx.fillRect(0, hor - 60, W, 120);
  ctx.restore();
}

function drawAxis(t, cam, alpha) {
  if (alpha <= 0.002) return;
  const y = CONFIG.axis.y;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.strokeStyle = C.axis; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  const x0 = sx(AXIS.x0, cam), xc = Math.min(W, sx(cam.x, cam) + (cam.z < 0.999 ? (AXIS.x1 - cam.x) * cam.z : 0));
  if (xc > x0) { const g = ctx.createLinearGradient(x0, 0, xc, 0); g.addColorStop(0, rgba(RGB.primary, 0.15)); g.addColorStop(1, rgba(energy(t) > 0.85 ? RGB.accent : RGB.primary, 0.9)); ctx.strokeStyle = g; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(Math.max(0, x0), y); ctx.lineTo(xc, y); ctx.stroke(); }
  ctx.font = `500 22px ${CONFIG.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  for (let m = 10; m <= 49; m++) {
    const x = sx(dateX(m), cam); if (x < -60 || x > W + 60) continue;
    const jan = m % 12 === 0;
    ctx.strokeStyle = jan ? C.tick : C.axis; ctx.lineWidth = jan ? 2 : 1.5;
    ctx.beginPath(); ctx.moveTo(x, y - (jan ? 12 : 5)); ctx.lineTo(x, y + (jan ? 12 : 5)); ctx.stroke();
    if (jan) { ctx.fillStyle = rgba(RGB.textDim, 0.8); ctx.fillText(String(2022 + m / 12), x, y - 24); }
  }
  const stations = SHOTS.filter(s => s.date && s.station !== false);
  stations.forEach((s, k) => {
    const x = sx(s.x, cam); if (x < -40 || x > W + 40) return;
    const visited = t >= s.t0 - 1e-6 || cam.z < 0.999, last = k === stations.length - 1, near = clamp(1 - Math.abs(x - W / 2) / 140);
    if (near > 0 && cam.z > 0.999) {      // 从站点升起的一道光，把文字、时间轴和上方图形连成一体
      const bg = ctx.createLinearGradient(0, y, 0, y - 240); bg.addColorStop(0, rgba(RGB.primary, 0.45 * near)); bg.addColorStop(1, rgba(RGB.primary, 0));
      ctx.strokeStyle = bg; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 240); ctx.stroke();
    }
    ctx.fillStyle = visited ? (last ? C.accent : C.primary) : RGB_BG();
    ctx.strokeStyle = visited ? (last ? C.accent : C.primary) : C.tick; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, (last && cam.z < 0.999 ? 8 : 5) + 2.5 * near, 0, 7); ctx.fill(); ctx.stroke();
    if (near > 0 && cam.z > 0.999) { ctx.strokeStyle = rgba(RGB.primary, 0.5 * near); ctx.beginPath(); ctx.arc(x, y, 16, 0, 7); ctx.stroke(); }
  });
  ctx.restore();
}
const RGB_BG = () => C.bgBottom;

function drawBokeh(t, cam) {          // 前景虚化光斑（视差比镜头快，制造纵深）
  const e = energy(t), n = Math.round(lerp(CONFIG.look.bokeh[0], CONFIG.look.bokeh[1], e));
  for (let i = 0; i < n; i++) {
    const b = STATIC.bokeh[i], x = (((b.x - cam.x * b.z) % 2600) + 2600) % 2600 - 340;
    const col = b.k > 0.6 && e > 0.55 ? RGB.accent : RGB.primary;
    const gr = ctx.createRadialGradient(x, b.y, 0, x, b.y, b.rad);
    gr.addColorStop(0, rgba(col, 0.03 + 0.04 * e)); gr.addColorStop(0.75, rgba(col, 0.02 + 0.03 * e)); gr.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = gr; ctx.fillRect(x - b.rad, b.y - b.rad, b.rad * 2, b.rad * 2);
  }
}

function drawGrain(t) {
  if (!CONFIG.look.grain) return;
  const f = Math.round(t * FPS), ox = (f * 97) % 256, oy = (f * 61) % 256;
  ctx.save(); ctx.globalAlpha = CONFIG.look.grain; ctx.globalCompositeOperation = 'overlay';
  ctx.translate(-ox, -oy); ctx.fillStyle = GRAIN; ctx.fillRect(ox, oy, W, H); ctx.restore();
}

// ---------- 文字 ----------
function text(str, x, y, size, weight, rgb, alpha, opts = {}) {
  if (alpha <= 0.003) return 0;
  ctx.save();
  ctx.font = `${weight} ${size}px ${CONFIG.font}`; ctx.textAlign = opts.align || 'center'; ctx.textBaseline = 'middle';
  ctx.letterSpacing = (opts.ls || 0) + 'px';
  ctx.fillStyle = rgba(rgb, alpha);
  if (opts.scale && opts.scale !== 1) { ctx.translate(x, y); ctx.scale(opts.scale, opts.scale); ctx.fillText(str, 0, 0); }
  else ctx.fillText(str, x, y);
  const w = ctx.measureText(str).width; ctx.restore(); return w;
}

function drawStationText(s, t, cam, alpha) {
  if (s.noText || alpha <= 0.003) return;
  const T = CONFIG.text;
  if (s.centerText) {          // OpenClaw：放在光环里
    const tau = Math.max(0, t - s.t0), k = 1 + 0.06 * (1 - EASE.out(clamp(tau / 0.4)));
    text(s.ym, 960, 448, 40, 500, RGB.accent, alpha, { ls: 8, scale: k });
    text(s.name, 960, 538, 120, 700, RGB.text, alpha, { scale: k });
    text(s.meaning, 960, 630, 46, 500, RGB.text, alpha * 0.92, { scale: k });
    return;
  }
  const x = s.textCenter ? CONFIG.center.x : sx(s.x, cam), dist = s.textCenter ? 1 : clamp(1 - EASE.in(clamp(Math.abs(x - W / 2) / 900), 3));
  const a = alpha * dist, y0 = s.textCenter ? CONFIG.center.y : T.flashY;
  if (s.flash) {               // 蓄段：每拍只放一个词
    const fw = CONFIG.transition.flashWindow;
    const q = s.flash.map((_, j) => j === 0 ? 1 : hv(t, s.t0 + j * BEAT, fw, 0.1));
    s.flash.forEach((w, j) => {
      const inn = q[j], out = j + 1 < q.length ? q[j + 1] : 0;
      const al = a * (j === 0 ? 1 : clamp((inn - 0.45) / 0.52)) * (1 - clamp(out / 0.45)); if (al <= 0.003) return;
      const big = j === s.flash.length - 1, num = j === 0 && /^\d/.test(w);
      const size = num ? 88 : big ? 132 : 104;
      const rgb = num ? RGB.primary : (s.id === 'recap' && big) ? RGB.accent : RGB.text;
      text(w, x, y0 + 28 * (1 - inn) - 28 * out, size, num ? 500 : 700, rgb, al, { ls: num ? 8 : 0 });
    });
    return;
  }
  let ay = 1, an = 1, am = 1;
  if (s.id === SHOTS[0].id) { ay = hv(t, s.t0 + 1 * BEAT, 0.45, 0.2); an = hv(t, s.t0 + 2 * BEAT, 0.45, 0.2); am = hv(t, s.t0 + 3 * BEAT, 0.45, 0.2); }
  text(s.ym, x, T.yearY + 10 * (1 - ay), 34, 500, RGB.primary, a * ay, { ls: 8 });
  text(s.name, x, T.nameY + 10 * (1 - an), s.name.length > 12 ? 68 : 84, 700, RGB.text, a * an);
  text(s.meaning, x, T.meaningY + 10 * (1 - am), 40, 400, RGB.textDim, a * am);
}

function drawEnd(s, t, cam, alpha) {
  ctx.save(); ctx.font = `600 72px ${CONFIG.font}`; ctx.letterSpacing = '2px';
  const widths = s.line.map(([str]) => ctx.measureText(str).width), total = widths.reduce((a, b) => a + b, 0);
  ctx.restore();
  let x = W / 2 - total / 2;
  s.line.forEach(([str, c], i) => { text(str, x, 505, 72, 600, RGB[c], alpha, { align: 'left', ls: 2 }); x += widths[i]; });
  const st = SHOTS.filter(q => q.date && q.station !== false), f = st[0], l = st[st.length - 1];
  text(f.ym, sx(f.x, cam), CONFIG.axis.y + 50, 30, 500, RGB.primary, alpha, { ls: 4 });
  text(l.ym, sx(l.x, cam), CONFIG.axis.y + 50, 30, 500, RGB.accent, alpha, { ls: 4 });
  // 一道光沿时间轴走一遍
  const q = EASE.inOut(clamp((t - s.t0 - 0.1) / 1.7), 4), xa = sx(f.x, cam), xb = sx(l.x, cam), hx = lerp(xa, xb, q), y = CONFIG.axis.y;
  const fade = alpha * (1 - EASE.in(clamp((t - s.t0 - 1.6) / 0.5), 3));
  if (fade > 0.01 && t >= s.t0) {
    const gr = ctx.createLinearGradient(hx - 260, 0, hx, 0);
    gr.addColorStop(0, rgba(RGB.text, 0)); gr.addColorStop(1, rgba(mixRGB(RGB.text, RGB.accent, q), 0.95 * fade));
    ctx.strokeStyle = gr; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(Math.max(xa, hx - 260), y); ctx.lineTo(hx, y); ctx.stroke();
    const hg = ctx.createRadialGradient(hx, y, 0, hx, y, 40); hg.addColorStop(0, rgba(mixRGB(RGB.text, RGB.accent, q), 0.5 * fade)); hg.addColorStop(1, rgba(RGB.accent, 0));
    ctx.fillStyle = hg; ctx.fillRect(hx - 40, y - 40, 80, 80);
  }
}

// ---------- 一帧 ----------
function draw(t) {
  if (!SHOTS) return;
  const st = stateAt(t), { a, b, p } = st, cam = camera(st, t);
  // 时间轴（及地面、巨型年份）的可见度
  let axisA = 1;
  if (a.motif === 'point' || a.motif === 'burst' || a.motif === 'stream') axisA = 0;
  if (a.out === 'push' && b.motif === 'stream') axisA = 1 - p;
  if (a.out === 'burst') axisA = 0;
  if (a.out === 'pullback' && b !== a) axisA = EASE.in(clamp((p - 0.3) / 0.67), 3);
  if (a.motif === 'end') axisA = 1;
  const zoomA = clamp((cam.z - AXIS.fitZoom) / (1 - AXIS.fitZoom));
  const centered = CONFIG.centeredMotifs.includes(a.motif) && (a === b || CONFIG.centeredMotifs.includes(b.motif) || p < 0.5);
  ctx.save();
  drawBackground(t, cam, centered || a.motif === 'end' ? CONFIG.center.y : CONFIG.stage.y);
  drawGiantYears(cam, axisA * zoomA);
  drawFloor(cam, axisA * zoomA);
  drawAxis(t, cam, axisA);

  // ---- 图形 + 转场（画在发光层上） ----
  const LA = layoutOf(a, t);
  let wipeX = null;
  renderGlow(t, g => {
    if (a === b || p <= 0) { drawLayout(g, LA, 1, stageXf(a, t)); return; }
    const LB = layoutOf(b, t), xa = stageXf(a, t), xb = stageXf(b, t);
    switch (a.out) {
      case 'morph': {            // 上一件事的图形变形成下一件事的图形
        drawLayout(g, morphLayout(LA, LB, p), 1, { ox: lerp(xa.ox, xb.ox, p), oy: lerp(xa.oy, xb.oy, p), s: lerp(xa.s, xb.s, p), bright: xb.bright });
        break;
      }
      case 'push': {             // 镜头推进穿过画面
        const za = Math.exp(Math.log(CONFIG.transition.pushZoom) * p);
        drawLayout(g, LA, 1 - EASE.out(clamp((p - 0.15) / 0.6), 3), { ...xa, s: xa.s * za });
        drawLayout(g, LB, EASE.out(clamp((p - 0.2) / 0.7), 3), { ...xb, s: xb.s * lerp(0.25, 1, p) });
        break;
      }
      case 'wipe': {             // 遮罩擦除（从右往左，新画面从前进方向进来）
        wipeX = lerp(W + 40, -40, p);
        g.save(); g.beginPath(); g.rect(0, 0, wipeX, H); g.clip(); drawLayout(g, LA, 1, xa); g.restore();
        g.save(); g.beginPath(); g.rect(wipeX, 0, W - wipeX, H); g.clip(); drawLayout(g, LB, 1, xb); g.restore();
        break;
      }
      case 'burst': {            // drop：拍点前光点蓄力，拍点那一帧直接切到光环
        if (t * FPS < Math.round(b.t0 * FPS) - 1e-6) drawLayout(g, LA, 1, xa); else drawLayout(g, LB, 1, xb);
        break;
      }
      case 'pullback': {         // 拉远：光环收成时间轴上的最后一站
        const last = SHOTS.filter(s => s.date && s.station !== false).slice(-1)[0];
        const cx = lerp(CONFIG.center.x, sx(last.x, cam), p), cy = lerp(CONFIG.center.y, CONFIG.axis.y, p);
        drawLayout(g, LA, 1 - EASE.in(clamp((p - 0.55) / 0.42), 3), { ox: cx, oy: cy, s: Math.exp(lerp(0, Math.log(8 / 345), p)), bright: 1 });
        break;
      }
    }
  });
  if (wipeX !== null) {
    const ba = clamp((CONFIG.transition.landAt - p) / 0.25);
    if (ba > 0) { const gg = ctx.createLinearGradient(wipeX, 0, wipeX + 180, 0); gg.addColorStop(0, rgba(RGB.primary, 0.22 * ba)); gg.addColorStop(1, rgba(RGB.primary, 0)); ctx.fillStyle = gg; ctx.fillRect(wipeX, 0, 180, H); ctx.fillStyle = rgba(RGB.text, 0.6 * ba); ctx.fillRect(wipeX - 1, 0, 2, H); }
  }

  drawBokeh(t, cam);
  // 文字区域压暗一点，让字从地面网格里浮出来
  const tg = ctx.createLinearGradient(0, CONFIG.axis.y + 20, 0, H);
  tg.addColorStop(0, 'rgba(3,5,10,0)'); tg.addColorStop(0.35, `rgba(3,5,10,${0.55 * axisA * zoomA})`); tg.addColorStop(1, `rgba(3,5,10,${0.7 * axisA * zoomA})`);
  ctx.fillStyle = tg; ctx.fillRect(0, CONFIG.axis.y + 20, W, H);

  // ---- 文字 ----
  if (a.motif === 'end') drawEnd(a, t, cam, 1);
  else if (a === b || p <= 0) drawStationText(a, t, cam, 1);
  else {
    let fa = 1 - EASE.in(clamp(p / 0.85), 3), fb = EASE.out(clamp((p - 0.25) / 0.72), 3);
    if (a.out === 'burst') { fa = 0; fb = t * FPS >= Math.round(b.t0 * FPS) - 1e-6 ? 1 : 0; }
    if (a.out === 'pullback') { fa = 1 - EASE.out(clamp(p / 0.5), 3); }
    drawStationText(a, t, cam, fa);
    if (b.motif === 'end') drawEnd(b, t, cam, EASE.in(clamp((p - 0.45) / (CONFIG.transition.landAt - 0.45)), 3));
    else drawStationText(b, t, cam, fb);
  }

  // drop 那一帧的唯一一次闪白
  const drop = BEATS.drop.time;
  if (t * FPS >= Math.round(drop * FPS) - 1e-6 && t < drop + 0.3) { ctx.fillStyle = rgba(mixRGB(RGB.text, RGB.accent, 0.4), 0.14 * (1 - EASE.out((t - drop) / 0.3, 4))); ctx.fillRect(0, 0, W, H); }

  // 暗角 + 胶片颗粒
  const vg = ctx.createRadialGradient(W / 2, H * 0.48, H * 0.42, W / 2, H * 0.48, H * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  drawGrain(t);
  // 结尾淡出
  const fo = BEATS.duration - CONFIG.fadeOut;
  if (t > fo) { ctx.fillStyle = `rgba(0,0,0,${EASE.inOut((t - fo) / CONFIG.fadeOut, 3)})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
  if (CONFIG.debug) drawDebug(t);
}

// 样片用：右上角拍点闪烁 + 帧号
function drawDebug(t) {
  const f = Math.round(t * FPS);
  const bi = BEATS.beats.findIndex(b => Math.round(b * FPS) === f);
  const lastBeat = BEATS.beats.reduce((acc, b, i) => (Math.round(b * FPS) <= f ? i : acc), 0);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(W - 330, 18, 312, 74);
  if (bi >= 0) {
    const down = BEATS.downbeats.includes(bi), isDrop = bi === BEATS.drop.beat;
    ctx.fillStyle = isDrop ? '#FF3B3B' : down ? C.accent : '#FFFFFF';
    ctx.fillRect(W - 90, 26, 58, 58);
  } else { ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.strokeRect(W - 90, 26, 58, 58); }
  ctx.font = `500 24px ${CONFIG.font}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(`F ${String(f).padStart(4, '0')}`, W - 316, 42);
  ctx.fillText(`拍 ${lastBeat}  ${t.toFixed(3)}s`, W - 316, 72);
  ctx.restore();
}

window.draw = draw;
window.__ready = (async () => {
  BEATS = await (await fetch('beats.json')).json();
  initShots();
  await Promise.all([300, 400, 500, 600, 700, 800].map(w => document.fonts.load(`${w} 64px ${CONFIG.font}`, '人人都能和 AI 聊天 2026 OpenClaw')));
  await document.fonts.ready;
  draw(0);
  return true;
})();
</script>
</body>
